name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SITE_URL:                ${{ vars.SITE_URL || 'https://www.averonoverseas.com' }}
      BASE_PATH:               ${{ vars.BASE_PATH || '/' }}
      PUBLIC_INDEXABLE:        ${{ vars.PUBLIC_INDEXABLE || 'false' }}
      PUBLIC_WEB3FORMS_KEY:    ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
      PUBLIC_GOATCOUNTER_CODE: ${{ secrets.PUBLIC_GOATCOUNTER_CODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Write CNAME
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > public/CNAME

      - uses: withastro/action@v3
        with:
          node-version: 20

      - name: SEO check
        run: node scripts/seo-check.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4